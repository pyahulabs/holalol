<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>te amo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f2a;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="musica" src="Minecraft - Dreiton, but only the second half of the song.mp3" loop preload="auto"></audio>

<script>
const C = document.getElementById("c"), x = C.getContext("2d");
const FUENTE = '"Dancing Script", cursive';
const FRASE = "te amo", LETRAS = "teamo";

let W, H, S;
let estado = "inicio", tiempo = 0, tFin = 0;
let yo, ella, items = [], parts = [], fondo = [], estrellas = [], pop = [];
let idx = 0, tLetra = 0, tCor = 0, tx = 0;

/* ---------------- utilidades de dibujo ---------------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
function rr(px, py, w, h, r){
  x.beginPath(); x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath();
}
function circulo(cx, cy, r){ x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); }
function corazon(cx, cy, s){
  const y = cy - s * .5;
  x.beginPath(); x.moveTo(cx, y + s * .3);
  x.bezierCurveTo(cx, y, cx - s * .5, y, cx - s * .5, y + s * .3);
  x.bezierCurveTo(cx - s * .5, y + s * .62, cx, y + s * .78, cx, y + s);
  x.bezierCurveTo(cx, y + s * .78, cx + s * .5, y + s * .62, cx + s * .5, y + s * .3);
  x.bezierCurveTo(cx + s * .5, y, cx, y, cx, y + s * .3);
  x.closePath();
}

/* ---------------- minion ---------------- */
function brazo(sx, ang){
  const ex = sx + Math.sin(ang) * 18, ey = 6 + Math.cos(ang) * 18;
  x.strokeStyle = "#e6bd2a"; x.lineWidth = 6; x.lineCap = "round";
  x.beginPath(); x.moveTo(sx, 6); x.lineTo(ex, ey); x.stroke();
  x.fillStyle = "#1d1d1d"; circulo(ex, ey, 5);
}
function minion(m){
  x.save(); x.translate(m.x, m.y); x.scale(m.sc, m.sc);
  // sombra
  x.fillStyle = "rgba(0,0,0,.28)"; x.beginPath(); x.ellipse(0, 54, 26, 5, 0, 0, 7); x.fill();
  const salto = m.walk ? Math.abs(Math.sin(m.t * 11)) * 4 : Math.abs(Math.sin(m.t * 3)) * 1.5;
  const paso = m.walk ? Math.sin(m.t * 11) * 3 : 0;
  x.translate(0, -salto);

  // piernas
  x.fillStyle = "#2d5c9a"; x.fillRect(-15, 36, 10, 12 + paso); x.fillRect(5, 36, 10, 12 - paso);
  x.fillStyle = "#1d1d1d"; rr(-19, 45 + paso, 15, 7, 3.5); x.fill(); rr(4, 45 - paso, 15, 7, 3.5); x.fill();

  // brazos (detrás del cuerpo)
  brazo(-25, m.saluda ? -2.5 + Math.sin(m.t * 9) * .35 : -.45 - paso * .05);
  brazo(25, m.saluda2 ? 2.5 + Math.sin(m.t * 9 + 1) * .35 : .45 + paso * .05);

  // cuerpo
  const g = x.createLinearGradient(-28, 0, 28, 0);
  g.addColorStop(0, "#fbe055"); g.addColorStop(1, "#e3b820");
  rr(-28, -44, 56, 86, 28); x.fillStyle = g; x.fill();

  x.save(); rr(-28, -44, 56, 86, 28); x.clip();
  // overol
  x.fillStyle = "#3a6db0"; x.fillRect(-30, 18, 60, 30); rr(-15, 3, 30, 20, 4); x.fill();
  x.strokeStyle = "#3a6db0"; x.lineWidth = 5;
  x.beginPath(); x.moveTo(-13, 6); x.lineTo(-30, -6); x.moveTo(13, 6); x.lineTo(30, -6); x.stroke();
  x.fillStyle = "#222"; circulo(-11, 7, 1.8); circulo(11, 7, 1.8);
  x.strokeStyle = "rgba(0,0,0,.25)"; x.lineWidth = 1.5; rr(-7, 9, 14, 9, 3); x.stroke();
  // correa de las antiparras
  x.fillStyle = "#2a2a2a"; x.fillRect(-30, -27, 60, 8);
  x.restore();

  // pelo
  x.strokeStyle = "#222"; x.lineWidth = 1.4; x.lineCap = "round";
  for (let i = -2; i <= 2; i++){
    x.beginPath(); x.moveTo(i * 4, -43); x.quadraticCurveTo(i * 6, -50, i * 7 + 2, -54); x.stroke();
  }

  // antiparras y ojos
  const ojos = m.ojos === 1 ? [0] : [-12, 12], R = m.ojos === 1 ? 15 : 12;
  for (const ex of ojos){
    x.fillStyle = "#7f868d"; circulo(ex, -23, R + 3.5);
    x.fillStyle = "#c3c9cf"; circulo(ex, -23, R + 1);
    x.fillStyle = "#fff"; circulo(ex, -23, R - 1);
    if (m.amor > .5){
      const p = 1 + Math.sin(m.t * 8) * .12;
      x.fillStyle = "#e8344e"; corazon(ex, -22, R * 1.35 * p); x.fill();
    } else {
      const ox = ex + m.mira * 3;
      x.fillStyle = "#7a4a1e"; circulo(ox, -22, R * .45);
      x.fillStyle = "#111"; circulo(ox, -22, R * .22);
      x.fillStyle = "#fff"; circulo(ox + 1.5, -24, 1.3);
    }
  }

  // cachetes
  if (m.amor > 0){
    x.globalAlpha = clamp(m.amor, 0, 1) * .55; x.fillStyle = "#ff6f8e";
    x.beginPath(); x.ellipse(-19, -6, 5, 3, 0, 0, 7); x.ellipse(19, -6, 5, 3, 0, 0, 7); x.fill();
    x.globalAlpha = 1;
  }
  // boca
  if (m.amor > .5){
    x.fillStyle = "#5a1a1a"; x.beginPath(); x.arc(0, -6, 7, 0, Math.PI); x.closePath(); x.fill();
    x.fillStyle = "#e86a7a"; x.beginPath(); x.ellipse(0, -1.5, 3.5, 1.8, 0, 0, 7); x.fill();
  } else {
    x.strokeStyle = "#3b1a0e"; x.lineWidth = 1.8;
    x.beginPath(); x.arc(0, -8, 7, .2 * Math.PI, .8 * Math.PI); x.stroke();
  }
  // moño
  if (m.mono){
    x.fillStyle = "#ff5c8a";
    x.beginPath(); x.moveTo(0, -46); x.lineTo(-13, -54); x.lineTo(-13, -38); x.closePath(); x.fill();
    x.beginPath(); x.moveTo(0, -46); x.lineTo(13, -54); x.lineTo(13, -38); x.closePath(); x.fill();
    x.fillStyle = "#e23d6d"; circulo(0, -46, 4);
  }
  x.restore();
}

/* ---------------- escena ---------------- */
function medir(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  C.width = W * dpr; C.height = H * dpr;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = clamp(Math.min(W / 380, H / 680), .7, 1.7);
  estrellas = Array.from({length: Math.round(W * H / 5000)}, () => ({
    x: Math.random() * W, y: Math.random() * H * .75, r: Math.random() * 1.2 + .3, f: Math.random() * 7
  }));
  if (yo){ yo.y = ella.y = suelo(); yo.sc = S * 1.15; ella.sc = S * 1.1; }
}
const suelo = () => H - 105 * S;

function reiniciar(){
  idx = 0; items = []; pop = [0, 0, 0, 0, 0, 0]; tLetra = 1; tCor = .3; tFin = 0;
  yo   = {x: W / 2 - 50 * S, y: suelo(), sc: S * 1.15, t: 0, amor: 1, mira: 1, ojos: 2};
  ella = {x: W / 2 + 50 * S, y: suelo(), sc: S * 1.1, t: 0, amor: 1, mira: -1, ojos: 1, mono: true};
  tx = W / 2;
}

function cielo(){
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0b0f2a"); g.addColorStop(.6, "#26164a"); g.addColorStop(1, "#4b1c4c");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // luna
  const lx = W * .8, ly = H * .13, lr = 26 * S;
  const halo = x.createRadialGradient(lx, ly, lr * .5, lx, ly, lr * 4);
  halo.addColorStop(0, "rgba(255,240,220,.25)"); halo.addColorStop(1, "rgba(255,240,220,0)");
  x.fillStyle = halo; x.fillRect(lx - lr * 4, ly - lr * 4, lr * 8, lr * 8);
  x.fillStyle = "#fff6e6"; circulo(lx, ly, lr);
  // estrellas
  for (const e of estrellas){
    x.globalAlpha = .25 + .75 * Math.abs(Math.sin(tiempo * .9 + e.f));
    x.fillStyle = "#fff"; circulo(e.x, e.y, e.r);
  }
  x.globalAlpha = 1;
  // corazones lejanos
  if (fondo.length < 14) fondo.push({x: Math.random() * W, y: H + 20, v: 10 + Math.random() * 18, s: (6 + Math.random() * 10) * S, f: Math.random() * 7});
  fondo = fondo.filter(f => f.y > -30);
  for (const f of fondo){
    f.y -= f.v * dt;
    x.globalAlpha = .18; x.fillStyle = "#ff8fab";
    corazon(f.x + Math.sin(tiempo + f.f) * 12, f.y, f.s); x.fill();
  }
  x.globalAlpha = 1;
  // pasto
  const gy = suelo() + 50 * S * 1.15;
  x.fillStyle = "#132b22";
  x.beginPath(); x.moveTo(0, gy + 8 * S); x.quadraticCurveTo(W / 2, gy - 22 * S, W, gy + 8 * S);
  x.lineTo(W, H); x.lineTo(0, H); x.closePath(); x.fill();
  x.strokeStyle = "#2d5a3f"; x.lineWidth = 2; x.stroke();
}

function chispas(px, py, n, colores = ["#ff4d79", "#ff8fab", "#ffd88a", "#ffffff"]){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = (60 + Math.random() * 260) * S;
    parts.push({x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120 * S, vida: 1,
      s: (5 + Math.random() * 9) * S, c: colores[i % colores.length], cor: Math.random() < .6});
  }
}
function dibujarParticulas(){
  parts = parts.filter(p => p.vida > 0);
  for (const p of parts){
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * S * dt; p.vida -= dt * .9;
    x.globalAlpha = clamp(p.vida, 0, 1); x.fillStyle = p.c;
    if (p.cor){ corazon(p.x, p.y, p.s); x.fill(); } else circulo(p.x, p.y, p.s * .25);
  }
  x.globalAlpha = 1;
}

/* letras de "te amo" arriba */
function casilleros(alpha){
  if (alpha <= 0) return;
  const fs = 44 * S, y = 78 * S;
  x.font = `700 ${fs}px ${FUENTE}`; x.textAlign = "center"; x.textBaseline = "middle";
  const ancho = fs * .62, total = (FRASE.length - 1) * ancho, x0 = W / 2 - total / 2;
  let k = 0;
  for (let i = 0; i < FRASE.length; i++){
    const ch = FRASE[i]; if (ch === " ") continue;
    const cx = x0 + i * ancho, lleno = k < idx;
    x.globalAlpha = alpha;
    if (lleno){
      pop[k] = Math.max(0, pop[k] - dt * 2.5);
      const esc = 1 + pop[k] * .6;
      x.save(); x.translate(cx, y); x.scale(esc, esc);
      x.shadowColor = "#ff4d79"; x.shadowBlur = 18 * S; x.fillStyle = "#fff";
      x.fillText(ch, 0, 0); x.restore();
    } else {
      x.globalAlpha = alpha * .35; x.fillStyle = "#fff";
      x.fillRect(cx - ancho * .32, y + fs * .32, ancho * .64, 2.5 * S);
    }
    k++;
  }
  x.globalAlpha = 1;
}

/* ---------------- juego ---------------- */
function lanzarLetra(){
  const r = 30 * S;
  items.push({letra: LETRAS[idx], x: r + 10 + Math.random() * (W - 2 * r - 20), y: -r, r,
    vy: H * (.21 + idx * .015), f: Math.random() * 7});
}
function lanzarCorazon(){
  const r = (10 + Math.random() * 9) * S;
  items.push({x: r + Math.random() * (W - 2 * r), y: -r, r, vy: H * (.18 + Math.random() * .14), f: Math.random() * 7});
}

function jugar(){
  yo.x += (tx - yo.x) * Math.min(1, dt * 12);
  yo.walk = Math.abs(tx - yo.x) > 4;
  yo.mira = clamp((tx - yo.x) / 25, -1, 1);
  yo.amor = Math.max(0, yo.amor - dt * .9);

  tLetra -= dt;
  if (tLetra <= 0 && !items.some(i => i.letra)) lanzarLetra();
  tCor -= dt;
  if (tCor <= 0){ lanzarCorazon(); tCor = .4 + Math.random() * .5; }

  const by = yo.y - 18 * yo.sc, alcance = 36 * yo.sc;
  items = items.filter(i => {
    i.y += i.vy * dt; i.x += Math.sin(tiempo * 2 + i.f) * 18 * S * dt;
    const dx = i.x - yo.x, dy = i.y - by;
    if (dx * dx + dy * dy < (i.r + alcance) ** 2){
      if (i.letra){
        pop[idx] = 1; idx++; yo.amor = 1.6; tLetra = .9;
        chispas(i.x, i.y, 40);
        if (idx === LETRAS.length){ estado = "fin"; tFin = 0; items = items.filter(o => !o.letra); }
      } else {
        yo.amor = Math.max(yo.amor, 1.1); chispas(i.x, i.y, 10, ["#ff4d79", "#ff8fab"]);
      }
      return false;
    }
    if (i.y > H + i.r){ if (i.letra) tLetra = .5; return false; }
    return true;
  });
}

function dibujarItems(){
  for (const i of items){
    if (i.letra){
      const glow = x.createRadialGradient(i.x, i.y, i.r * .4, i.x, i.y, i.r * 1.9);
      glow.addColorStop(0, "rgba(255,143,171,.5)"); glow.addColorStop(1, "rgba(255,143,171,0)");
      x.fillStyle = glow; circulo(i.x, i.y, i.r * 1.9);
      x.fillStyle = "rgba(255,250,245,.95)"; circulo(i.x, i.y, i.r);
      x.font = `700 ${i.r * 1.35}px ${FUENTE}`; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillStyle = "#c2185b"; x.fillText(i.letra, i.x, i.y + i.r * .05);
    } else {
      x.fillStyle = "#ff4d79"; corazon(i.x, i.y, i.r * 2); x.fill();
      x.fillStyle = "rgba(255,255,255,.45)"; circulo(i.x - i.r * .4, i.y - i.r * .45, i.r * .18);
    }
  }
}

function final(){
  tFin += dt;
  const izq = W / 2 - 42 * S, der = W / 2 + 42 * S;
  yo.x += (izq - yo.x) * Math.min(1, dt * 4); yo.walk = Math.abs(izq - yo.x) > 3; yo.mira = 1; yo.amor = 1;
  if (ella.x > der){ ella.x -= 150 * S * dt; ella.walk = true; } else { ella.x = der; ella.walk = false; }
  ella.saluda2 = ella.walk;
  const juntos = !ella.walk && tFin > 1;
  yo.saluda2 = juntos; ella.saluda = juntos;

  items = items.filter(i => (i.y += i.vy * dt) < H + 40);
  if (Math.random() < dt * 6) lanzarCorazon();

  if (juntos){
    const k = ease((tFin - 2) / 1.2), hy = suelo() - 95 * S;
    if (k > 0){
      const lat = 1 + Math.sin(tiempo * 5) * .06;
      x.save(); x.shadowColor = "#ff4d79"; x.shadowBlur = 40 * S;
      x.fillStyle = "#ff3b6b"; corazon(W / 2, hy, 70 * S * k * lat); x.fill(); x.restore();
    }
    if (!final.explotado && k > .9){ final.explotado = true; chispas(W / 2, hy, 120); }
  }
  const a = ease((tFin - 2.6) / 1.4);
  if (a > 0){
    const fs = Math.min(W * .26, 110 * S);
    x.save(); x.globalAlpha = a; x.font = `700 ${fs}px ${FUENTE}`;
    x.textAlign = "center"; x.textBaseline = "middle";
    x.shadowColor = "#ff4d79"; x.shadowBlur = 30 * S; x.fillStyle = "#fff";
    x.fillText(FRASE, W / 2, H * .33 + (1 - a) * 20 * S);
    x.restore();
  }
}

function inicio(){
  yo.saluda2 = ella.saluda = true;
  const lat = 1 + Math.max(0, Math.sin(tiempo * 6)) * .12;
  x.save(); x.shadowColor = "#ff4d79"; x.shadowBlur = 35 * S;
  x.fillStyle = "#ff3b6b"; corazon(W / 2, H * .38, 90 * S * lat); x.fill(); x.restore();
  // dedito pulsante sutil: un anillo que se expande sobre el corazón
  const k = (tiempo % 1.6) / 1.6;
  x.strokeStyle = `rgba(255,255,255,${.5 * (1 - k)})`; x.lineWidth = 2 * S;
  x.beginPath(); x.arc(W / 2, H * .38, (30 + 60 * k) * S, 0, 7); x.stroke();
}

/* ---------------- bucle ---------------- */
let antes = performance.now(), dt = 0;
function bucle(ahora){
  dt = Math.min(.05, (ahora - antes) / 1000); antes = ahora; tiempo += dt;
  yo.t += dt; ella.t += dt;
  cielo();
  if (estado === "inicio") inicio();
  if (estado === "juego") jugar();
  if (estado === "fin") final();
  dibujarItems();
  if (estado !== "juego") { minion(ella); }
  minion(yo);
  dibujarParticulas();
  if (estado === "juego") casilleros(1);
  if (estado === "fin") casilleros(1 - ease((tFin - 1.6) / .8));
  requestAnimationFrame(bucle);
}

/* ---------------- toques ---------------- */
C.addEventListener("pointerdown", e => {
  tx = e.clientX;
  empezarMusica();
  if (estado === "inicio"){
    estado = "juego"; chispas(W / 2, H * .38, 60);
    ella.x = W + 80 * S; ella.walk = false; yo.saluda2 = false; yo.amor = 0;
    tLetra = 1.2;
  } else if (estado === "fin" && tFin > 5.5){
    reiniciar(); final.explotado = false;
    estado = "juego"; ella.x = W + 80 * S; yo.amor = 0;
  }
});
C.addEventListener("pointermove", e => { tx = e.clientX; });

/* ---------------- música ---------------- */
const musica = document.getElementById("musica");
let sonando = false, ac;
function empezarMusica(){
  if (sonando) return; sonando = true;
  musica.volume = .8;
  musica.play().catch(ambiente);   // si no está dreiton.mp3, suena un fondo suave generado
}
function ambiente(){
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const master = ac.createGain(); master.gain.value = .1; master.connect(ac.destination);
  const acordes = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 55, 60, 64], [55, 59, 62, 67]];
  let k = 0;
  const tocar = () => {
    const t = ac.currentTime;
    acordes[k++ % 4].forEach(n => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = 440 * Math.pow(2, (n - 69) / 12);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t + 2); g.gain.linearRampToValueAtTime(0, t + 6.5);
      o.connect(g).connect(master); o.start(t); o.stop(t + 7);
    });
  };
  tocar(); setInterval(tocar, 5000);
}
document.addEventListener("visibilitychange", () => {
  if (!sonando) return;
  if (document.hidden){ musica.pause(); ac && ac.suspend(); }
  else { if (!ac) musica.play().catch(() => {}); else ac.resume(); }
});

addEventListener("resize", medir);
medir(); reiniciar(); requestAnimationFrame(bucle);
</script>
</body>
</html>
